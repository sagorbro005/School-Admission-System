services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: admissions
      POSTGRES_USER: admissions
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-trust}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - admission-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U admissions -d admissions"]
      interval: 3s
      timeout: 3s
      retries: 30
  backend:
    build: ./backend
    depends_on:
      db: {condition: service_healthy}
    environment:
      ConnectionStrings__Admissions: ${ADMISSIONS_CONNECTION:-Host=db;Database=admissions;Username=admissions;Maximum Pool Size=32}
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 4s
      timeout: 3s
      retries: 30
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    depends_on:
      backend: {condition: service_healthy}
    ports: ["3000:80"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  admission-data:
